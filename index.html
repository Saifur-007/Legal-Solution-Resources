<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>legal-solutions</title>
    <link rel="stylesheet" href="style.css"/>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="./images/business.png" type="image/x-icon"/>
  </head>
  <body>
    <header class="w-7xl mx-auto">
      
      <!-- Nav Menu -->

      <nav class="flex items-center justify-between mt-15">
        <img src="./images/logo2.png" alt="Logo" />
        <ul class="flex items-center gap-6">
          <li class="text-neutral-500 text-base font-normal font-['Poppins']">Home</li>
          <li class="text-neutral-500 text-base font-normal font-['Poppins']">Services</li>
          <img src="./images/right arrow.png" alt="" />
          <li class="text-neutral-500 text-base font-normal font-['Poppins']">Cases</li>
          <img src="./images/right arrow.png" alt="" />
          <li class="text-neutral-500 text-base font-normal font-['Poppins']">Blog</li>
          <img src="./images/right arrow.png" alt="" />
          <li class="text-neutral-500 text-base font-normal font-['Poppins']">Contact Us</li>
          <img src="./images/right arrow.png" alt="" />
        </ul>
        <button class="px-8 py-4 bg-[#B68C5A] rounded-lg text-white text-lg font-['Poppins']">Free Consultation</button>
      </nav>
      <section class="flex flex-col justify-center items-center gap-6 w-full max-w-7xl h-137.5 mt-14 bg-[url('./images/banner.png')] bg-cover bg-center bg-no-repeat rounded-lg">
          <div class="flex flex-col justify-center items-center gap-6">
            <h1 class="w-167 text-center text-white text-7xl font-extrabold font-['EB_Garamond'] leading-21.25">We Provide Effective Legal Solutions</h1>
            <p class="w-169.75 text-center text-neutral-200 text-base font-normal font-['Poppins'] leading-6">There are many variations of passages of Lorem Ipsum available, but the majority have suffered alteration in some form, by injected humour.</p>
          </div>
          <div class="flex justify-center items-center gap-6">
            <input class="w-125 h-16 bg-white rounded-lg px-5 py-3 placeholder:text-gray-400" type="text" placeholder="Search your services">
            <button class="px-8 py-4 bg-[#B68C5A] rounded-lg text-white text-lg font-['Poppins']">Search</button>
          </div>
      </section>
    </header>
  </body>
</html>
